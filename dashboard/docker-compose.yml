# The CI dashboard behind Caddy (TLS), on the ci-dashboard host. deploy.sh rolls it out.
#
# Both services sit on the default bridge network; only Caddy publishes public ports.
# The app is also published on host loopback for deploy.sh's health check.
# Settings come from /etc/rkapp.env, which deploy.sh writes from the ci-dashboard/env
# secret. AWS access is the instance role's (read-only), via the metadata service.
services:
  rkapp:
    build: .
    image: rkapp
    restart: always
    env_file: /etc/rkapp.env
    ports:
      - "127.0.0.1:8080:8080"
    command: gunicorn -w 50 -b 0.0.0.0:8080 rk:app
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [rkapp]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
